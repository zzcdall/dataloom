[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "dataloom"
version = "0.1.0"
description = "Upload a spreadsheet, get an auditable analysis report in seconds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "DataLoom contributors" }]
keywords = ["data-analysis", "visualization", "duckdb", "fastapi", "csv", "dashboard", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "duckdb>=1.1,<3",
  "pyarrow>=15,<25",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/zzcdall/dataloom"
Repository = "https://github.com/zzcdall/dataloom"
Issues = "https://github.com/zzcdall/dataloom/issues"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

